<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FF6B35">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0b0d12">
  <meta name="robots" content="noindex, nofollow">

  <title>BankiBites Admin</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/banki-bites/banki-bites-logo.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/banki-bites/banki-bites-logo.png">
  <link rel="icon" type="image/png" href="/banki-bites/banki-bites-logo.png">
  <link rel="shortcut icon" href="/banki-bites/banki-bites-logo.png">
  <link rel="manifest" href="/banki-bites/admin/manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://akcreation-apps.com/assets/bootstrap/css/bootstrap.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <script defer src="https://cloud.umami.is/script.js" data-website-id="36497ef4-1185-47b9-bcfb-24598a1a29d3"></script>
</head>
<body>

  <!-- Auth-resolving loader (shown until Firebase reports auth state) -->
  <div id="authLoading" class="auth-gate" role="status" aria-live="polite">
    <div class="auth-card">
      <img src="/banki-bites/banki-bites-logo.png" alt="BankiBites" class="auth-logo">
      <div class="auth-spinner" aria-hidden="true"><i class="fas fa-circle-notch fa-spin"></i></div>
      <p class="text-muted" style="margin:0;">Checking your session…</p>
    </div>
  </div>

  <!-- Sign-in gate -->
  <div id="authGate" class="auth-gate" hidden>
    <div class="auth-card">
      <img src="/banki-bites/banki-bites-logo.png" alt="BankiBites" class="auth-logo">
      <h2>BankiBites Admin</h2>
      <p class="text-muted">Sign in with your authorised Google account to continue.</p>
      <button id="googleSignInBtn" class="btn btn-primary btn-block btn-google">
        <i class="fab fa-google mr-2"></i> Sign in with Google
      </button>
      <p id="authError" class="auth-error" hidden></p>
    </div>
  </div>

  <!-- Main app -->
  <div id="appShell" hidden>
    <h1 class="sr-only">BankiBites Admin</h1>
    <header class="topbar">
      <div class="topbar-brand">
        <button id="sidebarExpandBtn" class="topbar-hamburger" type="button" aria-label="Expand sidebar" title="Expand sidebar">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <img src="/banki-bites/banki-bites-logo.png" alt="" class="topbar-logo">
        <span>Admin</span>
      </div>
      <div class="topbar-user">
        <button id="notifyServerIndicator" type="button"
                class="notify-server-indicator notify-server--unknown"
                title="Notification server status — checking…" aria-live="polite">
          <i class="fas fa-bell" aria-hidden="true"></i>
          <span class="notify-server-dot" aria-hidden="true"></span>
          <span class="sr-only" id="notifyServerLabel">Notification server status unknown</span>
        </button>
        <button id="userAvatar" type="button" class="user-avatar"
                aria-label="Signed in as (click to view account)" title="">
          <span id="userAvatarLetter" aria-hidden="true">?</span>
        </button>
        <span id="userEmail" class="sr-only"></span>
        <button id="signOutBtn" class="btn btn-sm btn-outline-light" title="Sign out">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <style>
      .notify-server-indicator{
        position:relative;display:inline-flex;align-items:center;justify-content:center;
        width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
        background:transparent;color:#fff;cursor:pointer;padding:0;margin-right:6px;
        transition:background .15s, box-shadow .15s;
      }
      .notify-server-indicator:hover{background:rgba(255,255,255,.08);}
      .notify-server-indicator i{font-size:14px;line-height:1;}
      .notify-server-dot{
        position:absolute;bottom:3px;right:3px;width:9px;height:9px;border-radius:50%;
        border:2px solid var(--topbar-bg,#111);
      }
      .notify-server--unknown .notify-server-dot{background:#9b9ba7;}
      .notify-server--online  .notify-server-dot{background:#2DB36A;box-shadow:0 0 0 2px rgba(45,179,106,.3);}
      .notify-server--offline .notify-server-dot{background:#D7263D;box-shadow:0 0 0 2px rgba(215,38,61,.35);animation:nsi-pulse 1.1s ease-in-out infinite;}
      .notify-server--offline{background:rgba(215,38,61,.1);border-color:rgba(215,38,61,.45);}
      .notify-server--offline i{color:#ff9aa5;}
      @keyframes nsi-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.25);}}
      @media (prefers-color-scheme: dark){
        .notify-server-dot{border-color:var(--topbar-bg,#0F0E15);}
      }
      .user-avatar{
        display:inline-flex;align-items:center;justify-content:center;
        width:32px;height:32px;border-radius:50%;
        background:linear-gradient(135deg,#FF6B35 0%,#E07A1F 100%);
        color:#fff;font-weight:700;font-size:13px;
        border:1px solid rgba(255,255,255,.15);padding:0;cursor:pointer;
        margin-right:6px;transition:transform .12s, box-shadow .12s;
        text-transform:uppercase;line-height:1;letter-spacing:0;
      }
      .user-avatar:hover{transform:scale(1.07);box-shadow:0 0 0 3px rgba(255,107,53,.25);}
      .user-avatar:focus-visible{outline:2px solid #FF6B35;outline-offset:2px;}
      .user-avatar span{display:inline-block;transform:translateY(-.5px);}
    </style>

    <nav class="tabbar" role="tablist" aria-label="Admin sections">
      <div class="sidebar-brand" aria-hidden="true">
        <img src="/banki-bites/banki-bites-logo.png" alt="" class="sidebar-brand-logo">
        <span class="sidebar-brand-text">BankiBites</span>
      </div>
      <div class="sidebar-nav">
        <button id="tab-btn-dashboard" class="tab-btn active" data-tab="dashboard" role="tab" aria-selected="true"  aria-controls="tab-dashboard" title="Dashboard"><i class="fas fa-chart-line" aria-hidden="true"></i><span>Dashboard</span></button>
        <button id="tab-btn-orders"    class="tab-btn"        data-tab="orders"    role="tab" aria-selected="false" aria-controls="tab-orders" title="Orders"><i class="fas fa-receipt"    aria-hidden="true"></i><span>Orders</span></button>
        <button id="tab-btn-grocery"   class="tab-btn"        data-tab="grocery"   role="tab" aria-selected="false" aria-controls="tab-grocery" title="Grocery"><i class="fas fa-basket-shopping" aria-hidden="true"></i><span>Grocery</span></button>
        <button id="tab-btn-partners"  class="tab-btn"        data-tab="partners"  role="tab" aria-selected="false" aria-controls="tab-partners" title="Partners"><i class="fas fa-store"    aria-hidden="true"></i><span>Partners</span></button>
        <button id="tab-btn-staff"     class="tab-btn"        data-tab="staff"     role="tab" aria-selected="false" aria-controls="tab-staff" title="Delivery"><i class="fas fa-motorcycle" aria-hidden="true"></i><span>Delivery</span></button>
        <button id="tab-btn-customers" class="tab-btn"        data-tab="customers" role="tab" aria-selected="false" aria-controls="tab-customers" title="Customers"><i class="fas fa-users"      aria-hidden="true"></i><span>Customers</span></button>
        <button id="tab-btn-broadcast" class="tab-btn"        data-tab="broadcast" role="tab" aria-selected="false" aria-controls="tab-broadcast" title="Broadcast"><i class="fas fa-bullhorn"   aria-hidden="true"></i><span>Broadcast</span></button>
        <button id="tab-btn-report"    class="tab-btn"        data-tab="report"    role="tab" aria-selected="false" aria-controls="tab-report" title="Report"><i class="fas fa-file-invoice" aria-hidden="true"></i><span>Report</span></button>
        <button id="tab-btn-settings"  class="tab-btn"        data-tab="settings"  role="tab" aria-selected="false" aria-controls="tab-settings" title="Settings"><i class="fas fa-cog"         aria-hidden="true"></i><span>Settings</span></button>
      </div>
      <button id="sidebarCollapseBtn" class="sidebar-collapse-btn" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
        <i class="fas fa-angles-left" aria-hidden="true"></i>
        <span>Collapse</span>
      </button>
    </nav>

    <main class="content">
      <section id="tab-dashboard" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-dashboard" tabindex="-1"></section>
      <section id="tab-orders"    class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-orders"    tabindex="-1"></section>
      <section id="tab-grocery"   class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-grocery"   tabindex="-1"></section>
      <section id="tab-partners"  class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-partners"  tabindex="-1"></section>
      <section id="tab-staff"     class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-staff"     tabindex="-1"></section>
      <section id="tab-customers" class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-customers" tabindex="-1"></section>
      <section id="tab-broadcast" class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-broadcast" tabindex="-1"></section>
      <section id="tab-report"    class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-report"    tabindex="-1"></section>
      <section id="tab-settings"  class="tab-panel"        role="tabpanel" aria-labelledby="tab-btn-settings"  tabindex="-1"></section>
    </main>

    <footer class="admin-footer">
      <p>&copy; <span id="footer-year"></span> <a href="https://akcreation-apps.com/services.html">AK Creation</a>. All rights reserved. &nbsp;|&nbsp; Made in Odisha ❤️</p>
    </footer>
  </div>

  <button id="installAppBtn" class="install-fab" type="button" hidden
          title="Install BankiBites Admin app">
    <img src="/banki-bites/banki-bites-logo.png" alt="" class="install-fab-logo">
    <span>Install app</span>
  </button>

  <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/banki-bites/admin/sw.js', { scope: '/banki-bites/admin/' })
          .catch(() => {});
      });
    }
    (function () {
      const btn = document.getElementById('installAppBtn');
      if (!btn) return;
      let deferred = null;
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferred = e;
        if (!isStandalone()) btn.hidden = false;
      });

      btn.addEventListener('click', async () => {
        if (deferred) {
          deferred.prompt();
          await deferred.userChoice;
          deferred = null;
          btn.hidden = true;
        } else if (isIOS && !isStandalone()) {
          Swal.fire({
            title: 'Install BankiBites Admin',
            html: 'Tap the <b>Share</b> icon in Safari, then choose <b>Add to Home Screen</b>.',
            icon: 'info',
            confirmButtonText: 'Got it'
          });
        }
      });

      if (isIOS && !isStandalone()) btn.hidden = false;

      window.addEventListener('appinstalled', () => { btn.hidden = true; deferred = null; });
    })();
  </script>
</body>
</html>
