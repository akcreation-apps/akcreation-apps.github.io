<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c9111a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="apple-touch-icon" href="../logo.png">
  <title>KS Panda — Audit Log</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <main class="ks-main">
    <div class="ks-section-head">
      <div>
        <h1><i class="fa-solid fa-clipboard-list text-muted" style="font-size:0.85em;"></i> Audit Log</h1>
        <p class="ks-subtle">Every admin and manager action, newest first. Showing the last 100 events.</p>
      </div>
    </div>

    <div class="ks-table-wrap">
      <div class="ks-table-scroll">
        <table class="table">
          <thead><tr>
            <th style="min-width:170px;">When</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Target</th>
            <th style="min-width:260px;">Details</th>
          </tr></thead>
          <tbody id="tbody">
            <tr class="ks-empty-row"><td colspan="5"><div class="ks-skel ks-skel-lg"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>&copy; <span id="footer-year"></span> <a href="https://akcreation-apps.com/services.html">AK Creation</a>. All rights reserved. &nbsp;|&nbsp; Made in Odisha</footer>

  <script type="module">
    import { requireRole } from "../assets/auth-guard.js";
    import { db, auth } from "../assets/firebase-init.js";
    import { mountTopbar, setYear, fmtDate, fmtTime } from "../assets/ui.js";
    import { collection, query, orderBy, limit, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    setYear();
    await requireRole(["admin"]);
    mountTopbar({
      role: "admin",
      onSignOut: () => signOut(auth).then(() => location.href = "../login.html"),
    });

    function escapeHtml(s = "") {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // Live lookup from site id → readable name, so the Details column renders
    // site names instead of raw Firestore ids. The subscription keeps the map
    // in sync; rows that already rendered are re-rendered when sites arrive.
    const siteNameById = new Map();
    const siteIdFields = new Set(["siteId", "assignedSiteIds"]);
    function resolveSiteId(id) {
      if (id == null) return id;
      return siteNameById.get(id) || id;
    }
    // Recursively walk the details payload and swap any known site-id field
    // (string or array) with its resolved human name. Unknown values pass
    // through untouched so other details (reason, timestamps, etc.) render
    // exactly as stored.
    function humaniseDetails(value) {
      // `null` is `typeof === "object"` but has no entries — must be checked
      // explicitly before the object branch or `Object.entries(null)` throws.
      // Audit entries from the site editor write `{ before: { address: null, lat: null, … } }`,
      // so this code path is exercised every time the admin edits a site.
      if (value === null) return value;
      if (Array.isArray(value)) return value.map(humaniseDetails);
      if (typeof value === "object") {
        const out = {};
        for (const [k, v] of Object.entries(value)) {
          if (k === "assignedSiteIds" && Array.isArray(v)) {
            out[k] = v.map(resolveSiteId);
          } else if (k === "siteId" && typeof v === "string") {
            out[k] = resolveSiteId(v);
          } else {
            out[k] = humaniseDetails(v);
          }
        }
        return out;
      }
      return value;
    }

    const ACTION_MAP = {
      // User lifecycle
      approveUser:             { label: "Approved user",         cls: "badge-approved", icon: "fa-user-check" },
      rejectUser:              { label: "Rejected user",         cls: "badge-rejected", icon: "fa-user-xmark" },
      deactivateUser:          { label: "Deactivated user",      cls: "badge-pending",  icon: "fa-user-slash" },
      reactivateUser:          { label: "Reactivated user",      cls: "badge-approved", icon: "fa-user-check" },
      deleteUser:              { label: "Deleted user",          cls: "badge-rejected", icon: "fa-user-minus" },
      editUserInfo:            { label: "Edited user info",      cls: "badge-info",     icon: "fa-id-card" },
      // Punch mutations
      addPunch:                { label: "Added punch",           cls: "badge-approved", icon: "fa-plus" },
      editPunch:               { label: "Edited punch",          cls: "badge-info",     icon: "fa-pen" },
      deletePunch:             { label: "Deleted punch",         cls: "badge-rejected", icon: "fa-trash" },
      // Correction request resolution
      rejectEditRequest:       { label: "Rejected correction",   cls: "badge-rejected", icon: "fa-xmark" },
      // Automatic / admin-driven punch-outs
      forcePunchOutOnUnassign: { label: "Force punch-out (unassign)", cls: "badge-pending", icon: "fa-right-from-bracket" },
      // Site lifecycle
      addSite:                 { label: "Added site",            cls: "badge-approved", icon: "fa-location-dot" },
      editSite:                { label: "Edited site",           cls: "badge-info",     icon: "fa-pen-to-square" },
      deleteSite:              { label: "Deleted site",          cls: "badge-rejected", icon: "fa-trash-can" },
      enableSite:              { label: "Enabled site",          cls: "badge-approved", icon: "fa-circle-check" },
      disableSite:             { label: "Disabled site",         cls: "badge-pending",  icon: "fa-ban" },
    };
    // Site-action events carry `targetSite` instead of `targetUser`. Pulling
    // the readable name from the `details.name` field (snapshot captured at
    // write time) means the audit row still reads sensibly even after the
    // site has been deleted.
    const SITE_ACTIONS = new Set(["addSite", "editSite", "deleteSite", "enableSite", "disableSite"]);
    function actionBadge(action) {
      const meta = ACTION_MAP[action] || { label: action, cls: "badge-muted", icon: "fa-circle" };
      return `<span class="badge ${meta.cls}"><i class="fa-solid ${meta.icon}" style="font-size:.7em;"></i> ${escapeHtml(meta.label)}</span>`;
    }
    // Small coloured chip next to the actor name so admin vs manager actions
    // are distinguishable at a glance. Falls back to a muted chip when the
    // legacy log entry has no actorRole field.
    function actorRoleBadge(role) {
      if (role === "admin")  return ' <span class="badge badge-info" style="font-size:.65rem;">admin</span>';
      if (role === "manager") return ' <span class="badge badge-pending" style="font-size:.65rem;">manager</span>';
      return "";
    }

    const nameCache = new Map();
    async function nameOf(uid) {
      if (!uid) return '';
      if (nameCache.has(uid)) return nameCache.get(uid);
      const s = await getDoc(doc(db, "attn_users", uid));
      const n = s.data()?.name ?? uid;
      nameCache.set(uid, n);
      return n;
    }

    const tbody = document.getElementById('tbody');
    // Cache the latest audit snapshot so we can re-render when the sites
    // map arrives (sites snapshot may fire after the first audit snapshot).
    let latestAuditSnap = null;
    onSnapshot(collection(db, "attn_sites"), (snap) => {
      siteNameById.clear();
      snap.forEach(s => siteNameById.set(s.id, s.data()?.name ?? s.id));
      // Re-render the cached audit snap with the fresh name map. Catch so a
      // throw here doesn't surface as an unhandled promise rejection with
      // no UI fallback (the primary onSnapshot keeps the page alive).
      if (latestAuditSnap) render(latestAuditSnap).catch(err => console.error("[audit] re-render failed", err));
    });

    const q = query(collection(db, "attn_auditLog"), orderBy("at", "desc"), limit(100));
    onSnapshot(q, async (snap) => {
      latestAuditSnap = snap;
      await render(snap);
    });

    async function render(snap) {
      if (snap.empty) {
        tbody.innerHTML = `<tr class="ks-empty-row"><td colspan="5">
          <div class="ks-empty">
            <div class="ks-empty-icon"><i class="fa-solid fa-clipboard"></i></div>
            <p class="ks-empty-title">Nothing logged yet</p>
            <p class="ks-empty-text">Admin actions and punch edits will appear here.</p>
          </div>
        </td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      for (const d of snap.docs) {
        const e = d.data();
        const tr = document.createElement('tr');
        const when = e.at?.toDate?.() ?? null;
        tr.innerHTML = `
          <td data-label="When">
            <div>${when ? escapeHtml(fmtDate(when)) : ""}</div>
            <div class="text-muted small">${when ? escapeHtml(fmtTime(when)) : ""}</div>
          </td>
          <td data-label="Actor">${escapeHtml(await nameOf(e.actor))}${actorRoleBadge(e.actorRole)}</td>
          <td data-label="Action">${actionBadge(e.action)}</td>
          <td data-label="Target">${
            SITE_ACTIONS.has(e.action)
              ? (e.details?.name
                  ? `<i class="fa-solid fa-location-dot text-muted" style="font-size:.75em;"></i> ${escapeHtml(e.details.name)}`
                  : (e.targetSite ? `<code class="text-muted small">${escapeHtml(e.targetSite)}</code>` : '<span class="text-muted">—</span>'))
              : (e.targetUser ? escapeHtml(await nameOf(e.targetUser)) : '<span class="text-muted">—</span>')
          }</td>
          <td data-label="Details"><code>${escapeHtml(JSON.stringify(humaniseDetails(e.details ?? {})))}</code></td>`;
        tbody.appendChild(tr);
      }
    }
  </script>
</body>
</html>
