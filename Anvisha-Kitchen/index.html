<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#1A1A2E">

    <title>Anvisha Kitchen</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="anvisha-logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="anvisha-logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="anvisha-logo.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="anvisha-logo.png">

    <!-- Preload LCP image (navbar logo) -->
    <link rel="preload" as="image" href="anvisha-logo.png" fetchpriority="high">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="36497ef4-1185-47b9-bcfb-24598a1a29d3"></script>

    <script src="restaurant.js"></script>
    <script src="app.js" type="module"></script>
    <script src="common.js"></script>
    <style>
        /* ── Reset ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary:      #FF6B35;
            --primary-dark: #E64A19;
            --navy:         #1A1A2E;
            --bg:           #F5F0EB;
            --card:         #FFFFFF;
            --card2:        #F0EBE5;
            --text:         #2D2D2D;
            --muted:        #6B6B6B;
            --border:       #E2D9D0;
            --shadow-sm:    0 1px 4px rgba(0,0,0,0.07);
            --shadow-md:    0 4px 14px rgba(0,0,0,0.13);
            --r:            12px;
            --nav-h:        56px;
            --strip-h:      0px;
            --loader-bg:         #F5F0EB;
            --loader-border:     rgba(0,0,0,0.1);
            --filter-hover:      #F0EBE5;
            --bestseller-act-bg: #FFF3EE;
            --placeholder-clr:   #bbb;
            --item-ctrl-bg:      rgba(0,0,0,0.62);
            --item-ctrl-border:  transparent;
            --modal-handle-bg:   #DDD;
            --delete-hover:      #fdecea;
            --error-clr:         #E53935;
            --dish-border:       #f5f0eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --navy:         #100F18;
                --bg:           #0D0C13;
                --card:         #181720;
                --card2:        #211F2C;
                --text:         #EDE9FF;
                --muted:        #7A748F;
                --border:       #2A273D;
                --shadow-sm:    0 1px 6px rgba(0,0,0,0.55);
                --shadow-md:    0 4px 20px rgba(0,0,0,0.65);
                --loader-bg:         #0D0C13;
                --loader-border:     rgba(255,255,255,0.08);
                --filter-hover:      rgba(255,107,53,0.12);
                --bestseller-act-bg: rgba(255,107,53,0.18);
                --placeholder-clr:   #4A4660;
                --item-ctrl-bg:      rgba(18,17,26,0.96);
                --item-ctrl-border:  rgba(255,107,53,0.65);
                --modal-handle-bg:   #3A3650;
                --delete-hover:      rgba(255,80,80,0.12);
                --error-clr:         #FF6B6B;
                --dish-border:       #2A273D;
            }
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-top: calc(var(--nav-h) + var(--strip-h));
        }

        /* ── Loader ── */
        .loader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--loader-bg);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .loader-logo {
            width: 90px;
            height: auto;
            opacity: 0.9;
        }
        .loader {
            width: 44px;
            height: 44px;
            border: 4px solid var(--loader-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Navbar ── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-h);
            z-index: 1000;
            background: var(--navy);
            display: flex;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo {
            cursor: pointer;
            flex: 1;
            min-width: 0;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            height: 40px;
            width: auto;
            display: block;
            flex-shrink: 0;
        }
        .logo-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .logo-text .brand-accent { color: var(--primary); }

        /* ── Delivery info strip — fixed below navbar, hides on scroll-down ── */
        .delivery-strip {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 6px 20px;
        }
        #deliveryStrip {
            position: fixed;
            top: var(--nav-h);
            left: 0;
            right: 0;
            z-index: 999;
            transition: transform 0.28s ease;
        }
        #deliveryStrip.strip-hidden {
            transform: translateY(-100%);
        }
        .delivery-strip-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-family: 'Poppins', sans-serif;
        }
        .ds-icon { color: var(--primary); font-size: 0.72rem; flex-shrink: 0; }
        .ds-label { color: var(--muted); font-weight: 400; }
        .ds-place { font-weight: 700; color: var(--text); }
        .ds-change {
            margin-left: auto;
            flex-shrink: 0;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.72rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .ds-change:hover { text-decoration: underline; }

        .icon-container {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .nav-icon {
            color: rgba(255,255,255,0.88);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: color 0.2s, transform 0.2s;
            background: none;
            border: none;
            padding: 0;
            text-decoration: none;
        }
        .nav-icon:hover { color: #fff; transform: scale(1.1); }

        /* Keep ID used by app.js */
        #invoiceIcon {}

        /* ── Refer icon with blinking dot ── */
        .refer-btn {
            position: relative;
            color: rgba(255,255,255,0.88);
        }
        .refer-btn::after {
            content: '';
            position: absolute;
            top: -4px; right: -4px;
            width: 8px; height: 8px;
            background: #FFD700;
            border-radius: 50%;
            animation: referPulse 1.4s ease-in-out infinite;
        }
        @keyframes referPulse {
            0%,100% { transform: scale(1);   opacity: 1; box-shadow: 0 0 0 0 rgba(255,215,0,0.7); }
            50%      { transform: scale(1.25); opacity: 0.8; box-shadow: 0 0 0 5px rgba(255,215,0,0); }
        }

        .cart-icon { position: relative; }
        .cart-count {
            position: absolute;
            top: -7px; right: -9px;
            background: var(--primary);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }

        /* ── Sticky bar (shortcuts + filters + search) ── */
        .sticky-bar {
            position: sticky;
            top: calc(var(--nav-h) + var(--strip-h));
            z-index: 900;
            background: var(--bg);
            padding-bottom: 2px;
        }
        .sticky-inner {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Category chips ── */
        .shortcuts-container { padding: 8px 12px 0; }
        .shortcuts-grid {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 2px 2px 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .shortcuts-grid::-webkit-scrollbar { display: none; }

        .shortcut-card {
            flex: 0 0 auto;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 5px 13px;
            cursor: pointer;
            user-select: none;
            transition: background 0.18s, border-color 0.18s;
        }
        .shortcut-card:hover {
            background: rgba(255,107,53,0.1);
            border-color: var(--primary);
        }
        .shortcut-card:active {
            background: rgba(255,107,53,0.2);
            border-color: var(--primary);
        }
        .shortcut-card a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.76rem;
            font-weight: 500;
            white-space: nowrap;
            display: block;
        }

        /* ── Search row ── */
        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 8px;
        }

        /* ── Search ── */
        .search-container {
            position: relative;
            flex: 1;
            padding: 0;
        }
        .search-container input[type="text"] {
            width: 100%;
            padding: 9px 38px 9px 38px;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-container input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.12);
        }
        .search-container input[type="text"]::placeholder { color: var(--placeholder-clr); }
        .search-prefix-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--placeholder-clr);
            font-size: 0.8rem;
            pointer-events: none;
        }
        .clear-button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: var(--placeholder-clr);
            font-size: 1.15rem;
            cursor: pointer;
            display: none;
            line-height: 1;
            padding: 0;
            transition: color 0.15s;
        }
        .clear-button:hover { color: var(--primary); }

        /* ── Bestseller filter button ── */
        .bestseller-filter-btn {
            flex-shrink: 0;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--card);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            padding: 0;
            position: relative;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .bestseller-filter-btn::after {
            content: '';
            position: absolute;
            top: 2px; right: 2px;
            width: 8px; height: 8px;
            background: var(--border);
            border-radius: 50%;
            border: 1.5px solid var(--card);
            transition: background 0.15s;
        }
        .bestseller-filter-btn.active {
            background: var(--bestseller-act-bg);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.2), inset 0 0 0 1px rgba(255,107,53,0.25);
        }
        .bestseller-filter-btn.active::after {
            background: var(--primary);
        }

        .sticky-divider {
            height: 1px;
            background: var(--border);
            margin: 0 12px;
        }

        /* ── Menu section ── */
        .menu { padding: 10px 0 4px; }
        .menu-container {
            padding: 0 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Category block ── */
        .category-block {
            margin-bottom: 20px;
            scroll-margin-top: calc(var(--nav-h) + var(--strip-h) + 144px); /* navbar + strip + sticky-bar */
        }
        .category-block > h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            padding: 8px 4px 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-block > h3::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--primary) 0%, transparent 100%);
            border-radius: 2px;
        }

        /* ── Subcategory block ── */
        .subcategory-block { margin-bottom: 10px; }
        .subcategory-block h4 {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.9px;
            padding: 4px 4px 5px;
        }

        /* ── Dish grid ── */
        .dish-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* ── Menu item wrapper ── */
        .menu-item {
            border-radius: var(--r);
            overflow: hidden;
            background: var(--card);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .menu-item-container { display: block; width: 100%; }

        /* ── Dish card ── */
        .dish-card {
            position: relative;
            width: 100%;
            aspect-ratio: 5 / 6;
            border-radius: var(--r) var(--r) 0 0;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            cursor: pointer;
        }

        .dish-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .dish-card:hover .dish-img { transform: scale(1.04); }

        /* ── FSSAI veg / non-veg badge (top-left of card) ── */
        .diet-badge {
            position: absolute;
            top: 5px; left: 5px;
            z-index: 3;
            width: 14px; height: 14px;
            border-radius: 2px;
            border: 1.5px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.92);
        }
        .diet-badge::after {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
        }
        .diet-badge.veg      { border-color: #00922A; }
        .diet-badge.veg::after   { background: #00922A; }
        .diet-badge.nonveg   { border-color: #963415; }
        .diet-badge.nonveg::after { background: #963415; }

        .dish-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 24px 6px 42px;
            background: linear-gradient(to top,
                rgba(0,0,0,0.85) 0%,
                rgba(0,0,0,0.55) 55%,
                rgba(0,0,0,0) 100%);
            color: #fff;
        }
        .dish-name {
            font-size: 0.7rem;
            font-weight: 600;
            margin: 0 0 1px;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.85);
        }
        .price {
            font-size: 0.65rem;
            font-weight: 700;
            color: #FFD166;
            margin: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.85);
        }

        /* ── Item control (ADD bar / qty stepper — bottom edge overlay) ── */
        .item-control {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 2;
            display: flex;
            align-items: stretch;
            min-height: 34px;
            background: var(--item-ctrl-bg);
            border: 1.5px solid var(--item-ctrl-border);
            transition: background 0.2s, border-color 0.2s;
        }
        .item-control.in-cart {
            background: rgba(22,163,74,0.92);
            border-color: rgba(22,163,74,0.8);
        }
        .add-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 0;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: background 0.15s;
            min-height: 34px;
        }
        .add-btn:hover,
        .add-btn:active { background: rgba(255,255,255,0.15); }
        .menu-item.unavailable .dish-img { filter: grayscale(0.8); opacity: 0.55; }
        .menu-item.unavailable .dish-overlay { opacity: 0.7; }
        .item-control.unavailable {
            background: rgba(60,60,60,0.85);
            border-color: rgba(120,120,120,0.6);
            cursor: not-allowed;
        }
        .add-btn.unavailable {
            color: #FFD166;
            font-size: 0.68rem;
            cursor: not-allowed;
            pointer-events: none;
        }
        .add-btn.unavailable:hover,
        .add-btn.unavailable:active { background: none; }
        .qty-stepper {
            display: flex;
            align-items: stretch;
            width: 100%;
        }
        .qty-btn {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            padding: 0;
        }
        .qty-btn:hover,
        .qty-btn:active { background: rgba(255,255,255,0.18); }
        .qty-display {
            flex: 0 0 auto;
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            min-width: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* ── Cart badge pop ── */
        @keyframes badgePop {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.6); }
            70%  { transform: scale(0.88); }
            100% { transform: scale(1); }
        }
        .cart-count.pop { animation: badgePop 0.38s ease; }

        /* ── Active category chip (scroll spy) ── */
        .shortcut-card.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .shortcut-card.active a { color: #fff; }

        /* ── FSSAI dot for filter pills ── */
        .fssai-dot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px; height: 12px;
            border-radius: 2px;
            border: 1.5px solid;
            flex-shrink: 0;
            vertical-align: middle;
            position: relative;
        }
        .fssai-dot::after {
            content: '';
            position: absolute;
            width: 5px; height: 5px;
            border-radius: 50%;
        }
        .fssai-dot.veg      { border-color: #00922A; }
        .fssai-dot.veg::after   { background: #00922A; }
        .fssai-dot.nonveg   { border-color: #963415; }
        .fssai-dot.nonveg::after { background: #963415; }

        /* ── Bestseller badge ── */
        .bestseller-badge {
            position: absolute;
            top: 5px; right: 5px;
            z-index: 3;
            background: #E64A19;
            color: #fff;
            font-size: 0.52rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            letter-spacing: 0.2px;
            line-height: 1.4;
            box-shadow: 0 1px 5px rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.25);
        }

        /* Offer badge on regular category cards (also carries an offer_price) */
        .offer-badge {
            position: absolute;
            top: 6px; left: 6px;
            z-index: 4;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            letter-spacing: 0.4px;
            line-height: 1.15;
            box-shadow: 0 2px 6px rgba(185,28,28,0.55), 0 0 0 1.5px rgba(255,255,255,0.85);
            text-shadow: 0 1px 1px rgba(0,0,0,0.25);
        }
        .dish-card:has(.offer-badge) .diet-badge { left: auto; right: 6px; }
        .dish-card:has(.offer-badge) .bestseller-badge { top: 32px; }
        .price .price-strike {
            text-decoration: line-through;
            text-decoration-color: #ef4444;
            text-decoration-thickness: 1.5px;
            color: #ffffff;
            opacity: 0.85;
            font-size: 0.92em;
            margin-right: 5px;
            font-weight: 600;
        }

        /* ============================================================
           Deals of the Day — horizontal rail (Zomato-style)
           ============================================================ */
        .offers-section {
            position: relative;
            margin: 8px -14px 20px;         /* bleed to viewport edges on mobile */
            padding: 16px 0 18px;
            background:
                radial-gradient(1200px 220px at 20% 0%, rgba(239,68,68,0.10), transparent 60%),
                radial-gradient(900px 200px at 85% 100%, rgba(245,158,11,0.10), transparent 60%),
                linear-gradient(180deg, #fff8ec 0%, #fff 100%);
            border-top: 1px solid rgba(239,68,68,0.10);

        /* Horizontal rail */
        .offers-rail {
            display: flex;
            gap: 12px;

            overflow-y: hidden;

        /* Individual offer card */
        .offer-card {

        /* Ribbon — corner discount tag */

        .offer-diet {

        .offer-bestseller {
            position: absolute;

            font-size: 0.44rem;
            font-weight: 700;

            border-radius: 5px;

        .offer-card-body {
            padding: 8px 9px 9px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .offer-card-name {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: #111827;
            margin: 0;
            line-height: 1.22;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

        .offer-card-price {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-top: 2px;
        }
        .offer-price-now {
            font-size: 0.82rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.02em;
        }
        .offer-price-was {
            font-size: 0.6rem;
            font-weight: 500;
            color: #9ca3af;
            text-decoration: line-through;
        }
        .offer-card-save {
            font-size: 0.54rem;
            font-weight: 700;
            color: #059669;

        /* Override the globally-absolute .item-control inside offer cards

            position: static;
            margin-top: 6px;
            min-height: 30px;
            border-radius: 8px;

            align-items: stretch;

        .offer-card .offer-card-control .add-btn {
            font-size: 0.68rem;
            min-height: 30px;
            padding: 0 6px;
        }
        .offer-card .offer-card-control .add-btn.unavailable {
            font-size: 0.6rem;
        }

        /* Tablet & up */
        @media (min-width: 768px) {
            .offers-section {
                margin: 12px 0 24px;
                border-radius: 16px;
                border: 1px solid rgba(245,158,11,0.18);

            .offers-head { padding: 0 20px 12px; }
            .offers-title { font-size: 1.2rem; }

        .view-cart-bar {

        /* ── No results ── */
        .no-results {

            border-radius: 4px;

        /* ── Screen reader only ── */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);

            border: 0;

        /* ── Skip link ── */
        .skip-link {

        .place-modal {

        /* ── Reduced motion ── */

        /* ── Dark-mode structural overrides ── */
        @media (prefers-color-scheme: dark) {
            body {
                background-image:
                    radial-gradient(ellipse 60% 40% at 15% 60%, rgba(255,107,53,0.05) 0%, transparent 70%),
                    radial-gradient(ellipse 50% 60% at 85% 10%, rgba(120,80,255,0.04) 0%, transparent 70%);

    <script>
    (function () {
        var strip = document.getElementById('deliveryStrip');
        var lastY = 0;

        function setStripH(h) {
            document.documentElement.style.setProperty('--strip-h', h + 'px');
        }

        // Sync layout padding/offsets whenever the strip is shown or hidden by app.js
        var mo = new MutationObserver(function () {
            requestAnimationFrame(function () {
                if (strip.style.display !== 'none') {
                    strip.classList.remove('strip-hidden');
                    setStripH(strip.offsetHeight);
                } else {
                    setStripH(0);
                }
            });
        });
        mo.observe(strip, { attributes: true, attributeFilter: ['style'] });

        // Hide on scroll-down, reveal on scroll-up
        window.addEventListener('scroll', function () {
            var y = window.scrollY;
            if (strip.style.display !== 'none') {
                if (y > lastY && y > 40) {
                    strip.classList.add('strip-hidden');
                    setStripH(0);
                } else if (y < lastY) {
                    strip.classList.remove('strip-hidden');
                    setStripH(strip.offsetHeight);
                }
            }
            lastY = y;
        }, { passive: true });
    }());
    </script>
