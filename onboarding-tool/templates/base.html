<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Restaurant Onboarding{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='onboarding.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="topbar">
        <h1>Restaurant Onboarding</h1>
        <nav class="steps" aria-label="Progress">
            <span class="step {% if step == 1 %}active{% endif %}">1. Details</span>
            <span class="step {% if step == 2 %}active{% endif %}">2. Credentials</span>
            <span class="step {% if step == 3 %}active{% endif %}">3. Menu</span>
        </nav>
    </header>
    <main class="container">
        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
