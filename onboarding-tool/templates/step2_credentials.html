{% extends "base.html" %}
{% set step = 2 %}
{% block title %}Step 2 — Credentials{% endblock %}
{% block content %}
<form method="post" class="card">
    <h2>Firebase / DB Credentials</h2>
    <p class="hint">Written to <code>credentials.json</code> exactly as entered (no encryption).</p>
    {% for key in keys %}
    <label>{{ key }}
        <input name="{{ key }}" required value="{{ form[key] or '' }}" autocomplete="off">
    </label>
    {% endfor %}
    <div class="actions">
        <a href="{{ url_for('step1') }}" class="secondary">← Back</a>
        <button type="submit" class="primary">Continue →</button>
    </div>
</form>
{% endblock %}
